[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra"
version = "0.1.0"
description = "3-camera x white-light surface inspection with a 3D map and red-dye penetrant check, plus a Llama (ExecuTorch) operator assistant"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]
twin = ["OpenEXR>=3.3", "onnxruntime>=1.20"]   # Blender 5.2 LTS is a separate app (brew install --cask blender@lts)
# On the Pi, picamera2 and gpiozero come from apt (python3-picamera2, python3-gpiozero).
# Create the venv with --system-site-packages so they are importable.

[project.scripts]
trinetra = "trinetra.cli:main"
trinetra-twin = "trinetra.twin.cli:main"
trinetra-app = "trinetra.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
