# Physical test coupons: the single source of truth for what is made, imaged and measured.
# Read docs/twin/DESIGN.md (sections 1, 3, 6) and docs/twin/coupon_fabrication.md first.
#
# One entry per IMAGED FACE (P1A = plate P1, face A). Each entry uses the scene-plan
# structure of DESIGN section 3 (plate, sheets, holes, rivets, defects, distractors) plus:
#   name, role (train | test | calib), make (ordered fabrication steps),
#   expect (rule findings the coupon is designed to trigger; checked by
#           `python -m ayas.twin.coupons validate`, see EXPECT_TYPES in twin/coupons.py).
# No footprints, no `near`, no `label`: the sampler computes them. No material dicts:
# the sampler randomises appearance. Keys not in DESIGN 3 (tool, note, grows_from, datum,
# distractor ids) are optional extras that consumers must not require.
#
# Conventions (plate frame, DESIGN 1):
#   - mm from the datum corner A (top-left of face A): u right, v down.
#   - angle_deg is measured from +u towards +v (clockwise as drawn, since v is down):
#     0 = +u (right), 90 = +v (down), 180 = -u (left), 270 = -v (up).
#   - holes: d_mm is the drill size (minor axis); an oval hole's major axis is
#     d_mm * ovality, along angle_deg; (u, v) is the centre after filing.
#   - D = fastener_d_mm = 4.0 (nominal blind-rivet / M4 screw diameter). AC 43.13-1B 4-57c:
#     edge distance (hole centre to plate edge) >= 2D = 8 mm, pitch (centre to centre) >= 3D = 12 mm.
#   - Piper SL 1095A-style dent class: "near" = dent rim to the nearest fastener edge
#     (rivet/screw head edge, or the open-hole edge) < 2D = 8 mm. A nick, or any dent within
#     0.5 mm of a plate edge, is an edge nick (dent_edge_nick), as in configs/spec_aero.yaml.
#   - An open round hole outside a riveted row is a lone_open_hole (HOLD for QA in aero.py).
#   - crack.slit length is measured from its start (hole edge or plate edge);
#     corrosion.fretting length_mm runs from the rivet head edge outwards along angle_deg;
#     corrosion.galvanic ring_w_mm runs from the fastener head edge outwards.
#   - Planned values. After fabrication, measure (coupon_fabrication.md section 8), put the
#     measured values here, add `measured: "<date> <method> <uncertainty>"` to each measured
#     defect, then re-run validate and templates (the CSV is regenerated from this file).
#
# Punch settings used everywhere (calibrated on S2A by sectioning; planned d_mm / depth_mm):
#   low x1 0.60/0.25  low x2 0.65/0.28  low x3 0.70/0.30
#   mid x1 0.80/0.35  mid x2 0.85/0.37  mid x3 0.90/0.40
#   high x1 1.00/0.45 high x2 1.05/0.47 high x3 1.10/0.50

schema: ayas.twin.coupons/1
fastener_d_mm: 4.0

defaults:
  plate: {thickness_mm: 3.0, edge_bevel_mm: 0.3, finish: mill}
  hole: {d_mm: 4.1, ovality: 1.0, angle_deg: 0.0, sheet: null, filled: true}
  rivet:
    blind_rivet: {head_d_mm: 8.0, head_h_mm: 1.3, mandrel_d_mm: 2.2, tilt_deg: 0.0}   # 4.0 mm dome head
    screw: {head_d_mm: 8.0, head_h_mm: 3.1, mandrel_d_mm: 0.0, tilt_deg: 0.0}         # M4 pan head, nut on face B
  datum: {corner: top-left, mark: A, u: 4.0, v: 4.0, size_mm: 3.0}                    # punched "A"; keep 8 x 8 mm clear

coupons:

  # ---------------------------------------------------------------------------------
  P1A:
    name: Reference (golden)
    role: train
    plate: {size_mm: [100.0, 100.0]}
    sheets: []
    holes:
      - {id: H1, u: 20.0, v: 15.0}
      - {id: H2, u: 40.0, v: 15.0}
      - {id: H3, u: 60.0, v: 15.0}
      - {id: H4, u: 80.0, v: 15.0}
      - {id: H5, u: 20.0, v: 85.0}
      - {id: H6, u: 40.0, v: 85.0}
      - {id: H7, u: 60.0, v: 85.0}
      - {id: H8, u: 80.0, v: 85.0}
    rivets:
      - {id: R1, hole: H1, kind: blind_rivet}
      - {id: R2, hole: H2, kind: blind_rivet}
      - {id: R3, hole: H3, kind: blind_rivet}
      - {id: R4, hole: H4, kind: blind_rivet}
      - {id: R5, hole: H5, kind: blind_rivet}
      - {id: R6, hole: H6, kind: blind_rivet}
      - {id: R7, hole: H7, kind: blind_rivet}
      - {id: R8, hole: H8, kind: blind_rivet}
    defects: []
    distractors: []
    expect: []
    make:
      - Choose the cleaner face as face A; punch the datum "A" in its top-left corner with a 3 mm letter punch (centre-punch dots would look like punch dents to the detector).
      - Photograph faces A and B bare (bare-plate set), gloves on.
      - Tape the P1A template on face A with its corner on the datum corner; light centre-punch the 8 hole crosshairs through the paper.
      - Drill a 2.5 mm pilot, then 4.1 mm, at H1-H8, plate clamped flat on scrap wood, drill square to the face.
      - Deburr both sides of every hole (a larger drill bit turned by hand); clean with isopropyl alcohol.
      - Set 8 blind rivets R1-R8 from face A (heads on face A), riveter nose square on the head.
      - Photograph face A. This is the golden reference - never damage, mark or penetrant-test P1.

  # ---------------------------------------------------------------------------------
  P2A:
    name: Fastener faults
    role: train
    plate: {size_mm: [100.0, 100.0]}
    sheets: []
    holes:
      - {id: H1, u: 20.0, v: 15.0}
      - {id: H2, u: 40.0, v: 15.0}
      - {id: H3, u: 60.0, v: 15.0, filled: false}                            # missing rivet
      - {id: H4, u: 80.0, v: 15.0}
      - {id: H5, u: 20.0, v: 85.0}
      - {id: H6, u: 40.0, v: 85.0, ovality: 1.25, angle_deg: 0.0, filled: false}   # filed oval 5.1 x 4.1
      - {id: H7, u: 60.0, v: 85.0}
      - {id: H8, u: 80.0, v: 85.0}
      - {id: H9, u: 90.0, v: 85.0}                                           # extra hole: pitch 10 = 2.5D
      - {id: H10, u: 5.0, v: 50.0}                                           # edge distance 5 = 1.25D
    rivets:
      - {id: R1, hole: H1, kind: blind_rivet}
      - {id: R2, hole: H2, kind: blind_rivet}
      - {id: R4, hole: H4, kind: blind_rivet}
      - {id: R5, hole: H5, kind: blind_rivet}
      - {id: R7, hole: H7, kind: blind_rivet}
      - {id: R8, hole: H8, kind: blind_rivet}
      - {id: R9, hole: H9, kind: blind_rivet}
      - {id: R10, hole: H10, kind: blind_rivet}
    defects:
      - {id: D1, cls: crack, kind: slit, tool: "jeweller's saw 1 mm",
         params: {u0: 20.0, v0: 17.05, angle_deg: 90.0, length_mm: 1.0, width_mm: 0.3},
         note: "crack-like notch; hidden under the 8 mm rivet head (realistic)"}
      - {id: D2, cls: crack, kind: slit, tool: "jeweller's saw 2 mm",
         params: {u0: 40.0, v0: 17.05, angle_deg: 90.0, length_mm: 2.0, width_mm: 0.3},
         note: "crack-like notch; only its tip reaches the head edge"}
      - {id: D3, cls: crack, kind: slit, tool: "jeweller's saw 4 mm",
         params: {u0: 82.05, v0: 15.0, angle_deg: 0.0, length_mm: 4.0, width_mm: 0.3},
         note: "crack-like notch along the rivet row"}
      - {id: D4, cls: crack, kind: slit, tool: "jeweller's saw 6 mm",
         params: {u0: 20.0, v0: 82.95, angle_deg: 270.0, length_mm: 6.0, width_mm: 0.3},
         note: "crack-like notch"}
      - {id: D5, cls: corrosion, kind: fretting, tool: graphite smear 8 x 2,
         params: {rivet: R7, angle_deg: 270.0, length_mm: 8.0, width_mm: 2.0, darkness: 0.6},
         note: "SIMULATED smoking-rivet streak (graphite/oxide smear), not real fretting"}
    distractors:
      - {id: X1, kind: burr, params: {hole: H3, h_mm: 0.1, w_mm: 0.4}}       # drilled from face B, not deburred
      - {id: X2, kind: burr, params: {hole: H6, h_mm: 0.1, w_mm: 0.4}}
    expect:
      - {type: missing_fastener, hole: H3}
      - {type: elongated_hole, hole: H6}
      - {type: pitch, holes: [H8, H9]}
      - {type: edge_distance, hole: H10}
      - {type: crack_indication, defect: D3}     # D1, D2 are (almost) under the heads: no visible indication expected
      - {type: crack_indication, defect: D4}
      - {type: corrosion, defect: D5}
      - {type: hold_unknown, distractor: X1}
      - {type: hold_unknown, distractor: X2}
    make:
      - Punch the datum "A" (top-left of face A) if not done; photograph faces A and B bare.
      - Tape the P2A template on face A; light centre-punch the 10 hole crosshairs H1-H10.
      - Drill 2.5 mm pilots at all 10 marks from face A.
      - Drill 4.1 mm from face A at H1, H2, H4, H5, H7, H8, H9, H10; deburr both sides of these 8 holes.
      - Turn the plate over and drill H3 and H6 at 4.1 mm from face B, so the exit burr is on face A. Do NOT deburr face A of H3 and H6 (burrs X1, X2).
      - File H6 oval with a round needle file along the row (u), about 0.5 mm each side, to 5.1 x 4.1 mm (caliper inside jaws).
      - "Jeweller's saw slits, blade threaded through the hole, cut outwards along the drawn line, length from the hole edge: D1 1 mm from H1 down, D2 2 mm from H2 down, D3 4 mm from H4 to the right, D4 6 mm from H5 up."
      - Set 8 blind rivets at H1, H2, H4, H5, H7, H8, H9, H10 (heads on face A). Leave H3 and H6 open.
      - Fretting streak D5 (simulated) - rub soft pencil graphite (6B) with a trace of oil on a cotton bud, lay one 8 x 2 mm streak from the R7 head edge upwards (-v), smudge it once in that direction with a gloved finger.
      - Wipe the rest of the face with isopropyl alcohol (not the streak); photograph; measure (guide section 8).

  # ---------------------------------------------------------------------------------
  P3A:
    name: Dents and scratches
    role: train
    plate: {size_mm: [100.0, 100.0]}
    sheets: []
    holes:
      - {id: H1, u: 20.0, v: 15.0}
      - {id: H2, u: 40.0, v: 15.0}
      - {id: H3, u: 60.0, v: 15.0}
      - {id: H4, u: 80.0, v: 15.0}
    rivets:
      - {id: R1, hole: H1, kind: blind_rivet}
      - {id: R2, hole: H2, kind: blind_rivet}
      - {id: R3, hole: H3, kind: blind_rivet}
      - {id: R4, hole: H4, kind: blind_rivet}
    defects:
      # punch dents NEAR rivets: rim to head-edge gap 2.5 / 3.5 / 4.5 mm (< 2D = 8 mm)
      - {id: D1, cls: dent, kind: punch, tool: punch low x1,
         params: {u: 20.0, v: 21.8, d_mm: 0.6, depth_mm: 0.25, rim_h_mm: 0.03}}
      - {id: D2, cls: dent, kind: punch, tool: punch mid x2,
         params: {u: 43.96, v: 21.86, d_mm: 0.85, depth_mm: 0.37, rim_h_mm: 0.03}}
      - {id: D3, cls: dent, kind: punch, tool: punch high x3,
         params: {u: 55.48, v: 22.84, d_mm: 1.1, depth_mm: 0.5, rim_h_mm: 0.03}}
      # punch dents FAR from rivets (> 15 mm)
      - {id: D4, cls: dent, kind: punch, tool: punch low x3,
         params: {u: 12.0, v: 48.0, d_mm: 0.7, depth_mm: 0.3, rim_h_mm: 0.03}}
      - {id: D5, cls: dent, kind: punch, tool: punch mid x1,
         params: {u: 50.0, v: 72.0, d_mm: 0.8, depth_mm: 0.35, rim_h_mm: 0.03}}
      - {id: D6, cls: dent, kind: punch, tool: punch high x2,
         params: {u: 88.0, v: 40.0, d_mm: 1.05, depth_mm: 0.47, rim_h_mm: 0.03}}
      # steel ball (20-25 mm) + hammer
      - {id: D7, cls: dent, kind: ball, tool: ball + light blow,
         params: {u: 22.0, v: 80.0, d_mm: 5.5, depth_mm: 0.3}}
      - {id: D8, cls: dent, kind: ball, tool: ball + firm blow,
         params: {u: 82.0, v: 82.0, d_mm: 7.5, depth_mm: 0.6}}
      # scribed along a steel rule (straight: control points on the chord)
      - {id: D9, cls: scratch, kind: scriber, tool: scriber 1 light pass,
         params: {ctrl_mm: [[26.0, 33.0], [39.33, 34.67], [52.67, 36.33], [66.0, 38.0]], width_mm: 0.08, depth_mm: 0.01, burr: 0.2},
         note: "light"}
      - {id: D10, cls: scratch, kind: scriber, tool: scriber 3 passes,
         params: {ctrl_mm: [[30.0, 46.0], [36.67, 50.67], [43.33, 55.33], [50.0, 60.0]], width_mm: 0.2, depth_mm: 0.03, burr: 0.5},
         note: "medium"}
      - {id: D11, cls: scratch, kind: scriber, tool: scriber 5 firm passes,
         params: {ctrl_mm: [[62.0, 64.0], [71.33, 60.67], [80.67, 57.33], [90.0, 54.0]], width_mm: 0.35, depth_mm: 0.06, burr: 0.8},
         note: "heavy"}
      - {id: D12, cls: scratch, kind: gouge, tool: file corner 3 passes,
         params: {ctrl_mm: [[6.0, 58.0], [11.33, 59.67], [16.67, 61.33], [22.0, 63.0]], width_mm: 1.0, depth_mm: 0.25, burr: 0.6}}
      - {id: D13, cls: scratch, kind: abrasion, tool: 220 grit 30 strokes along u,
         params: {u: 50.0, v: 86.0, w_mm: 10.0, h_mm: 10.0, angle_deg: 0.0, n_lines: 120, depth_mm: 0.01}}
      # edge nicks: triangular needle file across the front edge corner
      - {id: D14, cls: dent, kind: nick, tool: triangular file,
         params: {u: 0.0, v: 30.0, edge: left, d_mm: 2.0, depth_mm: 0.6}}
      - {id: D15, cls: dent, kind: nick, tool: triangular file,
         params: {u: 100.0, v: 66.0, edge: right, d_mm: 2.5, depth_mm: 0.8}}
    distractors:
      - {id: X1, kind: blend, params: {u: 88.0, v: 26.0, d_mm: 10.0, depth_mm: 0.25}}   # rework dish, length:depth 40:1 (flatter than the 20:1 minimum of AC 43.13-1B 6-115)
    expect:
      - {type: dent_minor, defect: D1}
      - {type: dent_minor, defect: D2}
      - {type: dent_minor, defect: D3}
      - {type: dent_negligible, defect: D4}
      - {type: dent_negligible, defect: D5}
      - {type: dent_negligible, defect: D6}
      - {type: dent_negligible, defect: D7}
      - {type: dent_negligible, defect: D8}
      - {type: dent_edge_nick, defect: D14}
      - {type: dent_edge_nick, defect: D15}
    make:
      - Punch the datum "A" (top-left of face A) if not done; photograph faces A and B bare.
      - Tape the P3A template on face A; centre-punch the 4 hole crosshairs; drill 2.5 mm pilots then 4.1 mm; deburr both sides. Do not rivet yet.
      - Put the plate flat on a steel block. Punch dents through the template at the marked settings (same session and settings as S2A) - near D1 low x1, D2 mid x2, D3 high x3; far D4 low x3, D5 mid x1, D6 high x2.
      - Ball dents on the steel block (practise first on a scrap aluminium offcut, never on an imaged face) - steel ball on the mark, hammer blow - D7 light (aim 5.5 mm across), D8 firm (aim 7.5 mm).
      - Set 4 blind rivets R1-R4 (heads on face A).
      - Scratches along a steel rule between the marked start and end points - D9 scriber 1 light pass, D10 3 passes, D11 5 firm passes; gouge D12 with the corner of a flat file, 3 passes.
      - Abrasion D13 - mask a 10 x 10 mm window with tape, 220 grit on a small flat block, 30 strokes along u; remove the tape.
      - Blend X1 (rework mark, not a defect) - 220 grit wrapped on a pencil eraser, small circular strokes, feathered out to a 10 mm shallow dish about 0.25 mm deep (check with a straight edge and feeler gauge); finish with 400 grit. Not with the steel ball - its radius gives a dish about 1 mm deep at 10 mm across.
      - Edge nicks D14 (left edge) and D15 (right edge) - 3-5 strokes of a triangular needle file across the face-A edge corner.
      - Clean with isopropyl alcohol; photograph; measure.

  # ---------------------------------------------------------------------------------
  P4A:
    name: Corrosion
    role: train
    plate: {size_mm: [100.0, 60.0]}        # after cutting S1 and S2 off the bottom; measure and update
    sheets: []
    holes:
      - {id: H1, u: 25.0, v: 28.0}
      - {id: H2, u: 75.0, v: 28.0}
    rivets:
      - {id: R1, hole: H1, kind: screw}
      - {id: R2, hole: H2, kind: screw}
    defects:
      - {id: D1, cls: corrosion, kind: galvanic, tool: salt+vinegar 48-72 h,
         params: {hole: H1, ring_w_mm: 2.0, powder: 0.6}}
      - {id: D2, cls: corrosion, kind: galvanic, tool: salt+vinegar 48-72 h,
         params: {hole: H2, ring_w_mm: 3.0, powder: 0.4}}
      - {id: D3, cls: corrosion, kind: pitting, tool: salt+vinegar 48-72 h,
         params: {u: 50.0, v: 14.0, r_mm: 4.0, n_pits: 25, pit_d_mm: [0.1, 0.5], powder: 0.5}}
      - {id: D4, cls: corrosion, kind: pitting, tool: salt+vinegar 48-72 h,
         params: {u: 50.0, v: 42.0, r_mm: 5.0, n_pits: 40, pit_d_mm: [0.15, 0.8], powder: 0.7}}
      - {id: D5, cls: crack, kind: slit, tool: hacksaw 3 mm,
         params: {u0: 88.0, v0: 0.0, angle_deg: 90.0, length_mm: 3.0, width_mm: 0.6},
         note: "crack-like edge notch; record the measured kerf"}
      - {id: D6, cls: crack, kind: slit, tool: hacksaw 6 mm,
         params: {u0: 0.0, v0: 40.0, angle_deg: 0.0, length_mm: 6.0, width_mm: 0.6},
         note: "crack-like edge notch; record the measured kerf"}
    distractors: []
    expect:
      - {type: corrosion, defect: D1}
      - {type: corrosion, defect: D2}
      - {type: corrosion, defect: D3}
      - {type: corrosion, defect: D4}
      - {type: crack_indication, defect: D5}
      - {type: crack_indication, defect: D6}
    make:
      - DAY 1, FIRST - on P4 face A punch the datum "A" top-left; photograph faces A and B bare.
      - Scribe cut lines across P4 at v = 60 and v = 80. Hacksaw just below each line in a vise with soft jaws; file the sawn edges straight and square; deburr with 400 grit. Strip v 60-80 is S1, strip v 80-100 is S2 (keep face A up and mark each strip's datum "A").
      - Measure P4A, S1 and S2 with the caliper; update their size_mm in configs/coupons.yaml (move strip features to mid-width if a strip is under 20 mm), re-run validate and templates, and print the new templates.
      - Tape the P4A template; centre-punch, drill 4.1 mm at H1 and H2; deburr.
      - Fit two M4 steel pan-head screws (plain or stainless steel, not zinc-plated) heads on face A, nuts on face B, finger-tight plus a quarter turn.
      - Start corrosion (DAY 1) - mask face A with tape except round windows for D3 (8 mm) and D4 (10 mm) and rings around the screw heads (D1 to 12 mm, D2 to 14 mm). Lay tissue soaked in 5 g salt per 100 ml white vinegar on the windows; keep wet in a closed plastic box away from electronics; re-wet morning and evening; 48-72 h.
      - Rinse gently with water, dab dry, keep the white powder; remove the tape.
      - Hacksaw edge slits with a fine (32 TPI) blade - D5 3 mm into the top edge at u = 88, D6 6 mm into the left edge at v = 40; measure length and kerf.
      - Photograph; measure.

  # ---------------------------------------------------------------------------------
  S1A:
    name: Fatigue crack (penetrant demo)
    role: calib
    plate: {size_mm: [100.0, 20.0]}
    sheets: []
    holes:
      - {id: H1, u: 50.0, v: 10.0, filled: false}
    rivets: []
    defects:
      - {id: D1, cls: crack, kind: slit, tool: "jeweller's saw 1 mm",
         params: {u0: 50.0, v0: 12.05, angle_deg: 90.0, length_mm: 1.0, width_mm: 0.3},
         note: "starter notch"}
      - {id: D2, cls: crack, kind: fatigue, tool: reverse bending, grows_from: D1,
         params: {pts_mm: [[50.0, 13.05], [50.15, 13.8], [49.95, 14.6], [50.2, 15.3], [50.1, 16.05]], width_mm: 0.02},
         note: "notch-initiated fatigue crack, planned 3 mm from the notch tip; replace pts_mm with the measured path"}
    distractors: []
    expect:
      - {type: lone_open_hole, hole: H1}          # an open hole outside any rivet row -> HOLD for QA
      - {type: crack_indication, defect: D1}
      - {type: crack_indication, defect: D2}
    make:
      - Punch the datum "A" (top-left of face A) on the strip; photograph faces A and B bare.
      - Tape the S1A template; centre-punch and drill H1 4.1 mm at mid-length; deburr both sides.
      - Starter notch D1 - jeweller's saw through H1, 1 mm from the hole edge towards the bottom long edge (+v).
      - Clamp S1 upright in the vise (soft jaws) by one end, with the hole centre 2-3 mm above the jaw tops. Reverse-bend the free end through the face (towards face A, then face B) about +-15-20 deg by hand, counting cycles; check with a 10x loupe every 10 cycles.
      - Stop when a hairline runs 2-5 mm past the notch tip towards the edge; return the strip to flat; record cycles and the crack length.
      - Photograph the surface (no penetrant) first; only then do the penetrant demonstration (guide section 7).

  # ---------------------------------------------------------------------------------
  S2A:
    name: Punch calibration
    role: calib
    plate: {size_mm: [100.0, 20.0]}
    sheets: []
    holes: []
    rivets: []
    defects:
      - {id: D1, cls: dent, kind: punch, tool: punch low x1, params: {u: 10.0, v: 10.0, d_mm: 0.6, depth_mm: 0.25, rim_h_mm: 0.03}}
      - {id: D2, cls: dent, kind: punch, tool: punch low x2, params: {u: 20.0, v: 10.0, d_mm: 0.65, depth_mm: 0.28, rim_h_mm: 0.03}}
      - {id: D3, cls: dent, kind: punch, tool: punch low x3, params: {u: 30.0, v: 10.0, d_mm: 0.7, depth_mm: 0.3, rim_h_mm: 0.03}}
      - {id: D4, cls: dent, kind: punch, tool: punch mid x1, params: {u: 40.0, v: 10.0, d_mm: 0.8, depth_mm: 0.35, rim_h_mm: 0.03}}
      - {id: D5, cls: dent, kind: punch, tool: punch mid x2, params: {u: 50.0, v: 10.0, d_mm: 0.85, depth_mm: 0.37, rim_h_mm: 0.03}}
      - {id: D6, cls: dent, kind: punch, tool: punch mid x3, params: {u: 60.0, v: 10.0, d_mm: 0.9, depth_mm: 0.4, rim_h_mm: 0.03}}
      - {id: D7, cls: dent, kind: punch, tool: punch high x1, params: {u: 70.0, v: 10.0, d_mm: 1.0, depth_mm: 0.45, rim_h_mm: 0.03}}
      - {id: D8, cls: dent, kind: punch, tool: punch high x2, params: {u: 80.0, v: 10.0, d_mm: 1.05, depth_mm: 0.47, rim_h_mm: 0.03}}
      - {id: D9, cls: dent, kind: punch, tool: punch high x3, params: {u: 90.0, v: 10.0, d_mm: 1.1, depth_mm: 0.5, rim_h_mm: 0.03}}
    distractors: []
    expect:
      - {type: dent_negligible, defect: D1}
      - {type: dent_negligible, defect: D2}
      - {type: dent_negligible, defect: D3}
      - {type: dent_negligible, defect: D4}
      - {type: dent_negligible, defect: D5}
      - {type: dent_negligible, defect: D6}
      - {type: dent_negligible, defect: D7}
      - {type: dent_negligible, defect: D8}
      - {type: dent_negligible, defect: D9}
    make:
      - Punch the datum "A" (top-left of face A) on the strip; photograph faces A and B bare.
      - Mark the punch cap at three positions (low = cap fully out, mid, high = fully in) with a marker so the settings repeat on P3 and P5.
      - Strip flat on the steel block, template taped on - punch D1-D9 along v = 10 - low x1, x2, x3, mid x1, x2, x3, high x1, x2, x3 (re-strike the same mark for x2 and x3).
      - Photograph face A; measure each mark's diameter (loupe and 0.5 mm scale).
      - Section - hacksaw along the strip about 2 mm below the mark line (v = 12), then file and sand the cut face up to v = 10 until each notch in the cut face is as wide as its mark. Finish with 400 grit.
      - Macro-photograph the cut face beside a 0.5 mm scale; read each true depth; update depth_mm in configs/coupons.yaml for S2A and the matching P3/P5 punch dents. Use the offcut sliver for the alloy bend test (guide section 3).

  # ---------------------------------------------------------------------------------
  P5A:
    name: Held-out test plate
    role: test             # NEVER rendered for training, never used to tune anything
    plate: {size_mm: [100.0, 100.0]}
    sheets: []
    holes:
      - {id: H1, u: 6.0, v: 80.0}                                            # edge distance 6 = 1.5D
      - {id: H2, u: 20.0, v: 80.0}
      - {id: H3, u: 34.0, v: 80.0, filled: false}                            # missing rivet
      - {id: H4, u: 48.0, v: 80.0}
      - {id: H5, u: 62.0, v: 80.0, ovality: 1.2, angle_deg: 0.0, filled: false}   # filed oval 4.9 x 4.1
      - {id: H6, u: 76.0, v: 80.0}
      - {id: H7, u: 87.0, v: 80.0}                                           # pitch 11 = 2.75D
    rivets:
      - {id: R1, hole: H1, kind: blind_rivet}
      - {id: R2, hole: H2, kind: blind_rivet}
      - {id: R4, hole: H4, kind: blind_rivet}
      - {id: R6, hole: H6, kind: blind_rivet}
      - {id: R7, hole: H7, kind: blind_rivet}
    defects:
      # punch dents NEAR rivets (gap to head edge 2.5 / 4.0 mm) and FAR
      - {id: D1, cls: dent, kind: punch, tool: punch mid x3,
         params: {u: 20.0, v: 73.05, d_mm: 0.9, depth_mm: 0.4, rim_h_mm: 0.03}}
      - {id: D2, cls: dent, kind: punch, tool: punch high x1,
         params: {u: 69.99, v: 73.99, d_mm: 1.0, depth_mm: 0.45, rim_h_mm: 0.03}}
      - {id: D3, cls: dent, kind: punch, tool: punch low x2,
         params: {u: 30.0, v: 35.0, d_mm: 0.65, depth_mm: 0.28, rim_h_mm: 0.03}}
      - {id: D4, cls: dent, kind: ball, tool: ball + medium blow,
         params: {u: 70.0, v: 30.0, d_mm: 6.5, depth_mm: 0.45}}
      - {id: D5, cls: scratch, kind: scriber, tool: scriber 3 passes,
         params: {ctrl_mm: [[12.0, 15.0], [23.0, 17.33], [34.0, 19.67], [45.0, 22.0]], width_mm: 0.2, depth_mm: 0.03, burr: 0.5}}
      - {id: D6, cls: scratch, kind: gouge, tool: file corner 3 passes,
         params: {ctrl_mm: [[40.0, 50.0], [46.0, 52.67], [52.0, 55.33], [58.0, 58.0]], width_mm: 0.9, depth_mm: 0.2, burr: 0.6}}
      - {id: D7, cls: crack, kind: slit, tool: "jeweller's saw 4 mm",
         params: {u0: 50.05, v0: 80.0, angle_deg: 0.0, length_mm: 4.0, width_mm: 0.3},
         note: "crack-like notch along the row"}
      - {id: D8, cls: corrosion, kind: pitting, tool: salt+vinegar 48-72 h,
         params: {u: 25.0, v: 55.0, r_mm: 3.5, n_pits: 20, pit_d_mm: [0.1, 0.6], powder: 0.5}}
      - {id: D9, cls: dent, kind: nick, tool: triangular file,
         params: {u: 88.0, v: 0.0, edge: top, d_mm: 2.0, depth_mm: 0.6}}
    distractors: []
    expect:
      - {type: edge_distance, hole: H1}
      - {type: missing_fastener, hole: H3}
      - {type: elongated_hole, hole: H5}
      - {type: pitch, holes: [H6, H7]}
      - {type: dent_minor, defect: D1}
      - {type: dent_minor, defect: D2}
      - {type: dent_negligible, defect: D3}
      - {type: dent_negligible, defect: D4}
      - {type: crack_indication, defect: D7}
      - {type: corrosion, defect: D8}
      - {type: dent_edge_nick, defect: D9}
    make:
      - Punch the datum "A" (top-left of face A) if not done; photograph faces A and B bare.
      - Tape the P5A template; centre-punch and drill H1-H7 (2.5 mm pilot, then 4.1 mm); deburr both sides of all 7 holes.
      - DAY 1 - start the pitting patch D8 with P4 - mask all of face A, the holes and the edges except a 7 mm window at D8; same salt+vinegar box, 48-72 h; then rinse, dab dry and remove the tape. Do the steps below only after this.
      - File H5 oval along the row, about 0.4 mm each side, to 4.9 x 4.1 mm.
      - Slit D7 - jeweller's saw through H4, 4 mm from the hole edge towards H5 (+u).
      - Punch dents on the steel block with the marked S2A cap settings - D1 mid x3, D2 high x1, D3 low x2; ball dent D4 with a medium blow (aim 6.5 mm).
      - Set 5 blind rivets at H1, H2, H4, H6, H7. Leave H3 and H5 open.
      - Scriber D5 (3 passes along a rule); gouge D6 (file corner, 3 passes); edge nick D9 on the top edge (triangular needle file).
      - Clean, photograph (including video-quality shots), measure, and bag it labelled TEST. No penetrant on P5 before the demo video is shot.
