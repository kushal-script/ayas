</g>
<text x="8" y="139" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">Datum corner A = top-left of face A: punch a small &#x27;A&#x27; at the marked spot. Coordinates in mm from A: u</text>
<text x="8" y="142.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">right, v down.</text>
<text x="8" y="145.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Make:</text>
<text x="8" y="148.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">1. Punch the datum &quot;A&quot; (top-left of face A) if not done; photograph faces A and B bare.</text>
<text x="8" y="152.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">2. Tape the P5A template; centre-punch and drill H1-H7 (2.5 mm pilot, then 4.1 mm); deburr both sides of</text>
<text x="8" y="155.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    all 7 holes.</text>
<text x="8" y="158.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">3. DAY 1 - start the pitting patch D8 with P4 - mask all of face A, the holes and the edges except a 7 mm</text>
<text x="8" y="162.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    window at D8; same salt+vinegar box, 48-72 h; then rinse, dab dry and remove the tape. Do the steps</text>
<text x="8" y="165.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    below only after this.</text>
<text x="8" y="168.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">4. File H5 oval along the row, about 0.4 mm each side, to 4.9 x 4.1 mm.</text>
<text x="8" y="172" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">5. Slit D7 - jeweller&#x27;s saw through H4, 4 mm from the hole edge towards H5 (+u).</text>
<text x="8" y="175.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">6. Punch dents on the steel block with the marked S2A cap settings - D1 mid x3, D2 high x1, D3 low x2; ball</text>
<text x="8" y="178.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    dent D4 with a medium blow (aim 6.5 mm).</text>
<text x="8" y="181.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">7. Set 5 blind rivets at H1, H2, H4, H6, H7. Leave H3 and H5 open.</text>
<text x="8" y="185.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">8. Scriber D5 (3 passes along a rule); gouge D6 (file corner, 3 passes); edge nick D9 on the top edge</text>
<text x="8" y="188.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    (triangular needle file).</text>
<text x="8" y="191.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">9. Clean, photograph (including video-quality shots), measure, and bag it labelled TEST. No penetrant on P5</text>
<text x="8" y="195.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    before the demo video is shot.</text>
<text x="8" y="198.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Designed findings:</text>
<text x="8" y="201.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">edge_distance H1, missing_fastener H3, elongated_hole H5, pitch H6-H7, dent_minor D1, dent_minor D2,</text>
<text x="8" y="205" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">dent_negligible D3, dent_negligible D4, crack_indication D7, corrosion D8</text>
