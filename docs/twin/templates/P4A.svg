</g>
<text x="8" y="99" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">Datum corner A = top-left of face A: punch a small &#x27;A&#x27; at the marked spot. Coordinates in mm from A: u</text>
<text x="8" y="102.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">right, v down.</text>
<text x="8" y="105.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Make:</text>
<text x="8" y="108.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">1. DAY 1, FIRST - on P4 face A punch the datum &quot;A&quot; top-left; photograph faces A and B bare.</text>
<text x="8" y="112.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">2. Scribe cut lines across P4 at v = 60 and v = 80. Hacksaw just below each line in a vise with soft jaws;</text>
<text x="8" y="115.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    file the sawn edges straight and square; deburr with 400 grit. Strip v 60-80 is S1, strip v 80-100 is</text>
<text x="8" y="118.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    S2 (keep face A up and mark each strip&#x27;s datum &quot;A&quot;).</text>
<text x="8" y="122.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">3. Measure P4A, S1 and S2 with the caliper; update their size_mm in configs/coupons.yaml (move strip</text>
<text x="8" y="125.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    features to mid-width if a strip is under 20 mm), re-run validate and templates, and print the new</text>
<text x="8" y="128.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    templates.</text>
<text x="8" y="132" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">4. Tape the P4A template; centre-punch, drill 4.1 mm at H1 and H2; deburr.</text>
<text x="8" y="135.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">5. Fit two M4 steel pan-head screws (plain or stainless steel, not zinc-plated) heads on face A, nuts on</text>
<text x="8" y="138.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    face B, finger-tight plus a quarter turn.</text>
<text x="8" y="141.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">6. Start corrosion (DAY 1) - mask face A with tape except round windows for D3 (8 mm) and D4 (10 mm) and</text>
<text x="8" y="145.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    rings around the screw heads (D1 to 12 mm, D2 to 14 mm). Lay tissue soaked in 5 g salt per 100 ml white</text>
<text x="8" y="148.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    vinegar on the windows; keep wet in a closed plastic box away from electronics; re-wet morning and</text>
<text x="8" y="151.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    evening; 48-72 h.</text>
<text x="8" y="155.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">7. Rinse gently with water, dab dry, keep the white powder; remove the tape.</text>
<text x="8" y="158.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">8. Hacksaw edge slits with a fine (32 TPI) blade - D5 3 mm into the top edge at u = 88, D6 6 mm into the</text>
<text x="8" y="161.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    left edge at v = 40; measure length and kerf.</text>
<text x="8" y="165" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">9. Photograph; measure.</text>
<text x="8" y="168.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Designed findings:</text>
<text x="8" y="171.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">corrosion D1, corrosion D2, corrosion D3, corrosion D4, crack_indication D5, crack_indication D6</text>
</svg>
