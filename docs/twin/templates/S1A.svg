<text x="53" y="30.6" font-size="2.2" fill="#000" text-anchor="start" font-weight="bold">Check: this bar must measure 50.0 mm.</text>
</g>
<text x="8" y="59" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">Datum corner A = top-left of face A: punch a small &#x27;A&#x27; at the marked spot. Coordinates in mm from A: u</text>
<text x="8" y="62.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">right, v down.</text>
<text x="8" y="65.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Make:</text>
<text x="8" y="68.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">1. Punch the datum &quot;A&quot; (top-left of face A) on the strip; photograph faces A and B bare.</text>
<text x="8" y="72.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">2. Tape the S1A template; centre-punch and drill H1 4.1 mm at mid-length; deburr both sides.</text>
<text x="8" y="75.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">3. Starter notch D1 - jeweller&#x27;s saw through H1, 1 mm from the hole edge towards the bottom long edge (+v).</text>
<text x="8" y="78.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">4. Clamp S1 upright in the vise (soft jaws) by one end, with the hole centre 2-3 mm above the jaw tops.</text>
<text x="8" y="82.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    Reverse-bend the free end through the face (towards face A, then face B) about +-15-20 deg by hand,</text>
<text x="8" y="85.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    counting cycles; check with a 10x loupe every 10 cycles.</text>
<text x="8" y="88.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">5. Stop when a hairline runs 2-5 mm past the notch tip towards the edge; return the strip to flat; record</text>
<text x="8" y="92" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    cycles and the crack length.</text>
<text x="8" y="95.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">6. Photograph the surface (no penetrant) first; only then do the penetrant demonstration (guide section 7).</text>
<text x="8" y="98.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Designed findings:</text>
<text x="8" y="101.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">crack_indication D1, crack_indication D2</text>
</svg>
