</g>
<g><title>D2 crack.fatigue: reverse bending; notch-initiated fatigue crack, planned 3 mm from the notch tip; replace pts_mm with the measured path</title>
<polyline points="50,13.05 50.15,13.8 49.95,14.6 50.2,15.3 50.1,16.05" fill="none" stroke="#8e24aa" stroke-width="0.25" stroke-dasharray="0.6 0.4"/>
</g>
<text x="52.85" y="6.7" font-size="1.8" fill="#000" text-anchor="start" font-weight="normal">H1 Ø4.1 open</text>
<text x="51.6" y="13.5" font-size="1.8" fill="#8e24aa" text-anchor="start" font-weight="normal">D1 slit 1</text>
<text x="51.7" y="16.5" font-size="1.8" fill="#8e24aa" text-anchor="start" font-weight="normal">D2 crack ~3</text>
<path d="M0 27H50" stroke="#000" stroke-width="0.4"/>
