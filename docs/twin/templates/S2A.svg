</g>
<text x="8" y="59" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">Datum corner A = top-left of face A: punch a small &#x27;A&#x27; at the marked spot. Coordinates in mm from A: u</text>
<text x="8" y="62.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">right, v down.</text>
<text x="8" y="65.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Make:</text>
<text x="8" y="68.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">1. Punch the datum &quot;A&quot; (top-left of face A) on the strip; photograph faces A and B bare.</text>
<text x="8" y="72.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">2. Mark the punch cap at three positions (low = cap fully out, mid, high = fully in) with a marker so the</text>
<text x="8" y="75.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    settings repeat on P3 and P5.</text>
<text x="8" y="78.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">3. Strip flat on the steel block, template taped on - punch D1-D9 along v = 10 - low x1, x2, x3, mid x1,</text>
<text x="8" y="82.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    x2, x3, high x1, x2, x3 (re-strike the same mark for x2 and x3).</text>
<text x="8" y="85.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">4. Photograph face A; measure each mark&#x27;s diameter (loupe and 0.5 mm scale).</text>
<text x="8" y="88.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">5. Section - hacksaw along the strip about 2 mm below the mark line (v = 12), then file and sand the cut</text>
<text x="8" y="92" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    face up to v = 10 until each notch in the cut face is as wide as its mark. Finish with 400 grit.</text>
<text x="8" y="95.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">6. Macro-photograph the cut face beside a 0.5 mm scale; read each true depth; update depth_mm in</text>
<text x="8" y="98.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    configs/coupons.yaml for S2A and the matching P3/P5 punch dents. Use the offcut sliver for the alloy</text>
<text x="8" y="101.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    bend test (guide section 3).</text>
<text x="8" y="105.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Designed findings:</text>
<text x="8" y="108.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">dent_negligible D1, dent_negligible D2, dent_negligible D3, dent_negligible D4, dent_negligible D5,</text>
<text x="8" y="111.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">dent_negligible D6, dent_negligible D7, dent_negligible D8, dent_negligible D9</text>
</svg>
