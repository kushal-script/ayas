<text x="8" y="139" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">Datum corner A = top-left of face A: punch a small &#x27;A&#x27; at the marked spot. Coordinates in mm from A: u</text>
<text x="8" y="142.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">right, v down.</text>
<text x="8" y="145.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Make:</text>
<text x="8" y="148.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">1. Choose the cleaner face as face A; punch the datum &quot;A&quot; in its top-left corner (lowest punch setting or a</text>
<text x="8" y="152.2" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    3 mm letter punch).</text>
<text x="8" y="155.5" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">2. Photograph faces A and B bare (bare-plate set), gloves on.</text>
<text x="8" y="158.8" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">3. Tape the P1A template on face A with its corner on the datum corner; light centre-punch the 8 hole</text>
<text x="8" y="162.1" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">    crosshairs through the paper.</text>
<text x="8" y="165.4" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">4. Drill a 2.5 mm pilot, then 4.1 mm, at H1-H8, plate clamped flat on scrap wood, drill square to the face.</text>
<text x="8" y="168.7" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">5. Deburr both sides of every hole (a larger drill bit turned by hand); clean with isopropyl alcohol.</text>
<text x="8" y="172" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">6. Set 8 blind rivets R1-R8 from face A (heads on face A), riveter nose square on the head.</text>
<text x="8" y="175.3" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">7. Photograph face A. This is the golden reference - never damage, mark or penetrant-test P1.</text>
<text x="8" y="178.6" font-size="2.3" fill="#000" text-anchor="start" font-weight="bold">Designed findings:</text>
<text x="8" y="181.9" font-size="2.3" fill="#000" text-anchor="start" font-weight="normal">none (reference)</text>
</svg>
